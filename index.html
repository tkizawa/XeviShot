<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Vertical Shooter</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="480" height="640"></canvas>
        <div id="ui-layer">
            <div id="score-display">SCORE: <span id="score">0</span></div>
            <div id="lives-display">LIVES: <span id="lives">3</span></div>
        </div>
        <div id="title-screen" class="screen">
            <h1>RETRO SHOOTER</h1>
            <p>Press ARROW KEYS to move</p>
            <p>X - Zapper (Air Attack)</p>
            <p>Z - Blaster (Ground Attack)</p>
            <p class="blink">Press ANY KEY to Start</p>
        </div>
        <div id="game-over-screen" class="screen hidden">
            <h1>GAME OVER</h1>
            <p>FINAL SCORE: <span id="final-score">0</span></p>
            <p class="blink">Press ANY KEY to Restart</p>
        </div>
    </div>
    <script src="js/entities.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
